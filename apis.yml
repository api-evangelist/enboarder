- aid: enboarder-scim-api
  name: Enboarder SCIM 2.0 API
  description: 'SCIM 2.0 user provisioning and management API for creating, reading,
    updating and deactivating Enboarder users from an identity provider. Exposes the
    standard discovery endpoints (/scim/v2/ServiceProviderConfig, /scim/v2/ResourceTypes,
    /scim/v2/Schemas) and the /scim/v2/Users resource. Authenticated with an OAuth
    bearer token or HTTP Basic. Enboarder''s published ServiceProviderConfig reports
    bulk, filter and sort as unsupported.'
  humanURL: https://help.enboarder.com/en/articles/5890669-scim-api-user-provisioning-and-management
  baseURL: https://api.ore.e1.enboarder.com
