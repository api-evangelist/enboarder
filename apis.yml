aid: enboarder
name: Enboarder
description: 'Enboarder is an employee onboarding and people-activation platform used
  by HR teams, managers and IT to design, automate and measure personalized employee
  journeys across preboarding, onboarding, compliance, internal transitions, offboarding
  and enablement. It exposes a regional REST API for launching, updating, cancelling
  and reporting on workflows, managing employee profiles and exporting form data, a
  SCIM 2.0 endpoint for user provisioning, and an outbound Webhook module that posts
  configurable JSON payloads to downstream systems such as Slack, Jira and ServiceNow.
  API access is region-scoped across Australia, the EU, the United States and Canada,
  and is authenticated with either an account API key or OAuth 2.0 client credentials.'
