apis:
- aid: enboarder-rest-api
  name: Enboarder REST API
  description: 'REST API for launching basic and advanced Enboarder workflows, updating
    and cancelling running workflows, managing employee profiles and photos, and exporting
    workflow and form reporting data. Paths are versioned in the URI: /restapi/v1 and
    /reports use the account API key, /restapi/v2 and /reports/v2 use OAuth 2.0 client
    credentials. Base hosts are region-scoped (AU, EU, US, CA); the US host is recorded
    here as the baseURL.'
  humanURL: https://help.enboarder.com/en/collections/2404029-enboarder-api-docs
  baseURL: https://api.ore.e1.enboarder.com
  tags:
