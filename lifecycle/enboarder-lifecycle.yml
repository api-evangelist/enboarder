versioning:
  scheme: uri-path
  current:
  - v1
  - v2
  detail: >-
    Path version is bound to the authentication mechanism, not to a release train:
    /restapi/v1 + /reports are API-key paths, /restapi/v2 + /reports/v2 are OAuth paths.
    Both are documented as current. There is no version header, no date-based version,
    and no published version-support window.
  docs: https://help.enboarder.com/en/articles/4151199-enboarder-api-docs-authentication-overview
