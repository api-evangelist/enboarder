  policy_url: null
  sunset_header: false
  deprecation_header: false
  detail: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation header support, and no
    end-of-life schedule is published. v1 is not marked deprecated despite v2 existing.
    No Deprecation pointer is emitted in apis.yml.
status_page:
  url: null
  detail: >-
    No status page found. Two candidates were probed on 2026-08-12 and both are false
    positives: https://status.enboarder.io returns 200 but redirects to the
    enboarder.com marketing homepage, and https://enboarder.statuspage.io returns 200
    but redirects to the Atlassian Statuspage product page — neither serves an Enboarder
    incident feed. https://enboarder.com/status/ returns 404. No StatusPage pointer is
    emitted in apis.yml.
  probes:
