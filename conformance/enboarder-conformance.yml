- id: mcp
  name: Model Context Protocol
  conforms: false
  evidence: >-
    No hosted MCP server found. Enboarder markets "Agentic AI" as in-product AI agents
    for employee journeys, not as an external agent-callable protocol surface.
- id: webhooks
  name: Outbound webhooks
  conforms: true
  evidence: >-
    First-class Webhook module configurable per workflow with destination URL, custom
    headers, POST/PUT/GET, and a JSON body built from dynamic employee/form tokens.
  source: https://help.enboarder.com/en/articles/2938834-modules-webhook
